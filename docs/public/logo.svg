<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background glow & gradients -->
    <linearGradient id="driveBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="driveGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="driveYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 1   0 0.8 0 0 0.8   0 0 0 0 0.2   0 0 0 1 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="256" cy="256" r="236" fill="#0f172a" stroke="url(#driveBlue)" stroke-width="6" opacity="0.9" />

  <!-- Outer Triangular Drive Rings -->
  <!-- Bottom Bar (Green) -->
  <path d="M 120 380 L 392 380 L 442 380 C 458 380 467 362 458 348 L 418 280 L 170 280 L 120 366 C 111 380 120 380 120 380 Z" 
        fill="url(#driveGreen)" opacity="0.95" />

  <!-- Right Slanted Bar (Blue) -->
  <path d="M 440 348 L 305 114 C 297 100 277 100 269 114 L 145 328 L 202 328 L 287 180 L 388 356 Z" 
        fill="url(#driveBlue)" opacity="0.95" />

  <!-- Left Slanted Bar (Yellow/Amber) -->
  <path d="M 170 280 L 256 132 C 264 118 284 118 292 132 L 322 184 L 237 328 L 145 328 Z" 
        fill="url(#driveYellow)" opacity="0.95" />

  <!-- Center Energy Core Accent (DriveKit Lightning Bolt) -->
  <path d="M 276 96 L 200 260 L 260 260 L 220 416 L 332 232 L 268 232 Z" 
        fill="url(#boltGradient)" 
        filter="url(#boltGlow)" />
</svg>
